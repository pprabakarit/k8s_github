apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  type: NodePort
  selector:
    app: nginx  # Matches the pod's label
  ports:
    - protocol: TCP
      port: 80       # Service port (cluster-internal)
      targetPort: 80 # Pod's container port
      nodePort: 8880 # External port (30000-32767 range)
